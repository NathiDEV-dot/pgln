<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Walk through the PGLN 3D store and discover four websites and interactive projects.">
<title>PGLN — 3D Store</title>
<style>
:root{color-scheme:dark;--paper:#f9f3df;--muted:#c6c5ad;--lime:#f7dca3;--panel:#202720;--line:#f7dca34d;font:16px/1.4 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#1c2720;color:var(--paper)}
button,a{font:inherit;color:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,canvas:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
#world{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}#world:active{cursor:grabbing}
header{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.1rem clamp(1rem,3vw,3rem);background:linear-gradient(#101710ef,transparent);pointer-events:none}
header>*{pointer-events:auto}.brand{display:flex;align-items:center;gap:.8rem}.brand strong{font-size:1.9rem;letter-spacing:-.1em;line-height:1}.brand span{font:700 .72rem/1.2 monospace;color:var(--lime);padding-left:.8rem;border-left:1px solid var(--line);letter-spacing:.11em}
button,.open{border:1px solid var(--line);border-radius:.45rem;background:var(--panel);padding:.58rem .9rem}
button:hover{border-color:var(--lime)}
#status{position:fixed;top:37%;left:50%;transform:translateX(-50%);padding:1rem;background:var(--panel);border-radius:.5rem;text-align:center;max-width:min(88vw,26rem)}
#hint{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);margin:0;padding:.5rem .8rem;border-radius:.35rem;background:#161d18ed;border:1px solid var(--line);text-align:center;font-size:.83rem;white-space:nowrap}
#controls{position:fixed;bottom:1rem;left:1rem;display:grid;grid-template-columns:repeat(3,2.8rem);gap:.3rem}
#controls button{touch-action:none;padding:0;min-height:2.55rem;font-size:1.2rem;user-select:none}
#controls [data-key="w"]{grid-column:2}#controls [data-key="a"]{grid-column:1}
#panel{position:fixed;right:1rem;bottom:1rem;width:min(22rem,calc(100% - 2rem));padding:1.2rem;border:1px solid var(--line);border-radius:.75rem;background:var(--panel);box-shadow:0 10px 40px #0005}
#panel h2{margin:0;line-height:1.1;font-size:1.7rem;letter-spacing:-.05em}
#panel p{margin:.65rem 0 1rem;color:var(--muted)}
#close-detail{float:right;margin:-.4rem -.45rem 0 .4rem}
.open{display:inline-block;text-decoration:none;background:var(--lime);border-color:var(--lime);color:#1c2617;font-weight:800}
dialog{width:min(28rem,calc(100% - 2rem));max-height:85dvh;color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:1.25rem}
dialog::backdrop{background:#101611a8}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}.dialog-head h1{margin:0;font-size:1.45rem;letter-spacing:-.04em}
.directory{list-style:none;padding:0;margin:1rem 0 0}.directory li{display:flex;align-items:center;justify-content:space-between;gap:.4rem;border-top:1px solid var(--line);padding:.65rem 0}.directory a{text-underline-offset:.25rem}.directory button{font-size:.78rem;white-space:nowrap}
[hidden]{display:none!important}
@media(max-width:670px){#hint{bottom:6.55rem;font-size:.72rem}#panel{bottom:9rem}header{padding:.8rem 1rem}.brand strong{font-size:1.6rem}}
</style>
</head>
<body>
<canvas id="world" tabindex="0" aria-label="PGLN 3D store. Use W A S D to walk, arrow keys to look, and Enter to inspect the display in front of you."></canvas>
<header>
  <div class="brand"><strong>PGLN</strong><span>3D STORE</span></div>
  <button id="show-directory" type="button">Directory</button>
</header>
<p id="status" role="status">Opening the store…</p>
<div id="controls" aria-label="Walk controls" hidden>
  <button data-key="w" type="button" aria-label="Walk forward">↑</button>
  <button data-key="a" type="button" aria-label="Step left">←</button>
  <button data-key="s" type="button" aria-label="Walk backward">↓</button>
  <button data-key="d" type="button" aria-label="Step right">→</button>
</div>
<p id="hint" hidden></p>
<section id="panel" aria-labelledby="project-title" hidden>
  <button id="close-detail" type="button" aria-label="Close project details">×</button>
  <h2 id="project-title"></h2>
  <p id="project-description"></p>
  <a class="open" id="open-project" target="_blank" rel="noopener">Open website</a>
</section>
<dialog id="directory">
  <div class="dialog-head"><h1>Store directory</h1><form method="dialog"><button>Close</button></form></div>
  <ul class="directory" id="directory-list"></ul>
</dialog>
<script type="module">
const projects = [
  { name:'THE CUT', label:['THE','CUT.'], type:'BARBER STUDIO', color:'#f2a36e', ink:'#211715', description:'A barber studio website with a gallery and appointment booking.', url:'https://the-cut-barber-studio-nkosi.nathinice0125.chatgpt.site', x:-4.45, z:2.1 },
  { name:'Game Night', label:['GAME','NIGHT'], type:'BROWSER GAME', color:'#c3d97f', ink:'#172719', description:'A charades game to play with friends.', url:'https://games-night-charades.nathinice0125.chatgpt.site', x:4.45, z:2.1 },
  { name:'Portfolio OS', label:['PORTFOLIO','OS'], type:'INTERACTIVE PORTFOLIO', color:'#91c5b7', ink:'#142820', description:'A retro desktop you can explore in your browser.', url:'https://nkosi-desktop-portfolio.nathinice0125.chatgpt.site', x:-4.45, z:-3.7 },
  { name:'$tussy — Mfana ko West', label:['$TUSSY'], type:'CREATIVE PORTFOLIO', color:'#d79db0', ink:'#3a1f2b', description:'A creative portfolio built around a device-inspired interface.', url:'https://frvky-desktop-recreation.nathinice0125.chatgpt.site', x:4.45, z:-3.7 }
];
const canvas = document.querySelector('#world');
const directory = document.querySelector('#directory');
const panel = document.querySelector('#panel');
const openProject = document.querySelector('#open-project');
const status = document.querySelector('#status');
const controls = document.querySelector('#controls');
const hint = document.querySelector('#hint');
const keys = new Set();
let visitDisplay;

for (const project of projects) {
  const item = document.createElement('li');
  const link = document.createElement('a');
  link.textContent = project.name;
  link.href = project.url;
  link.target = '_blank';
  link.rel = 'noopener';
  const locate = document.createElement('button');
  locate.textContent = 'Go to display';
  locate.hidden = true;
  locate.dataset.locate = '';
  locate.addEventListener('click', () => {
    directory.close();
    visitDisplay(project);
  });
  item.append(link, locate);
  document.querySelector('#directory-list').append(item);
}
document.querySelector('#show-directory').addEventListener('click', () => {
  keys.clear();
  directory.showModal();
});
document.querySelector('#close-detail').addEventListener('click', () => {
  panel.hidden = true;
  canvas.focus();
});

function showProject(project, focus = false) {
  document.querySelector('#project-title').textContent = project.name;
  document.querySelector('#project-description').textContent = project.description;
  openProject.href = project.url;
  panel.hidden = false;
  if (focus) openProject.focus();
}

try {
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#374839');
  scene.fog = new THREE.Fog('#374839', 18, 35);
  const camera = new THREE.PerspectiveCamera(68, 1, .05, 42);
  camera.rotation.order = 'YXZ';
  camera.position.set(0, 1.76, 8.5);
  let yaw = 0;
  let pitch = -.025;
  const displays = [];
  const ray = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  function box(width, height, depth, color, x, y, z, parent = scene) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(width,height,depth), new THREE.MeshLambertMaterial({color}));
    mesh.position.set(x,y,z);
    parent.add(mesh);
    return mesh;
  }

  function graphic(width, height, draw) {
    const source = document.createElement('canvas');
    source.width = width;
    source.height = height;
    draw(source.getContext('2d'), width, height);
    const texture = new THREE.CanvasTexture(source);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return texture;
  }

  function sign(width, height, texture, x, y, z, parent = scene) {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width,height), new THREE.MeshBasicMaterial({map:texture}));
    mesh.position.set(x,y,z);
    parent.add(mesh);
    return mesh;
  }

  const brass = '#b18b4e';
  const walnut = '#624230';
  const darkGreen = '#222e26';
  const plaster = '#686856';
  const glow = '#fff0cd';
  scene.add(new THREE.HemisphereLight('#fff0d6','#535b4e',1.5));
  const keyLight = new THREE.DirectionalLight('#fff1df',1.85);
  keyLight.position.set(-3,7,5);
  scene.add(keyLight);

  const stone = graphic(512,512,(ctx,w,h) => {
    ctx.fillStyle = '#9a8b74';
    ctx.fillRect(0,0,w,h);
    let seed = 722;
    const random = () => {
      seed = (Math.imul(seed,1664525)+1013904223) >>> 0;
      return seed/4294967296;
    };
    const tones = ['#736450','#baa88c','#e2cab0','#88795d','#544d44'];
    for (let i=0;i<2800;i++) {
      ctx.fillStyle = tones[Math.floor(random()*tones.length)];
      ctx.globalAlpha = .2+random()*.37;
      const x=random()*w, y=random()*h, size=.45+random()*2.7;
      ctx.fillRect(x,y,size*1.6,size);
    }
    ctx.globalAlpha = .32;
    ctx.strokeStyle = '#504438';
    ctx.strokeRect(.5,.5,w-1,h-1);
  });
  stone.wrapS = stone.wrapT = THREE.RepeatWrapping;
  stone.repeat.set(11,15);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(14,19),new THREE.MeshLambertMaterial({map:stone}));
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  box(2.8,.009,18,'#394639',0,.012,0);
  for (const x of [-1.35,1.35]) box(.026,.012,18,brass,x,.022,0);
  box(14,4.7,.2,darkGreen,0,2.35,-9.5);
  box(14,4.7,.2,plaster,0,2.35,9.5);
  box(.2,4.7,19,plaster,-7,2.35,0);
  box(.2,4.7,19,plaster,7,2.35,0);
  box(14,.2,19,'#302e26',0,4.75,0);
  for (const x of [-6.88,6.88]) {
    box(.13,.85,19,walnut,x,.425,0);
    box(.15,.045,19,brass,x,.865,0);
    for (let z = -8; z <= 8; z += 2) {
      box(.19,3.9,.07,'#514739',x,2.79,z);
    }
  }
  for (let x = -6.6; x <= 6.7; x += .26) {
    box(.115,4.6,.18,walnut,x,2.3,-9.31);
  }
  box(14,.07,.17,brass,0,.25,-9.15);
  box(5.65,2.15,.25,'#292b23',0,3.03,-9.07);
  const masthead = graphic(1152,420,(ctx,w,h) => {
    const gradient = ctx.createLinearGradient(0,0,w,h);
    gradient.addColorStop(0,'#344236');
    gradient.addColorStop(1,'#17261f');
    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = '#bd9e61';
    ctx.lineWidth = 3;
    ctx.strokeRect(22,22,w-44,h-44);
    ctx.fillStyle = '#f9dfaa';
    ctx.textAlign = 'center';
    ctx.font = '900 172px system-ui';
    ctx.fillText('PGLN',w/2,218);
    ctx.font = '600 34px monospace';
    ctx.fillText('W E B   S H O W R O O M',w/2,300);
  });
  sign(5.47,1.99,masthead,0,3.03,-8.935);

  const lightSurface = new THREE.MeshBasicMaterial({color:glow});
  const metal = new THREE.MeshLambertMaterial({color:brass});
  for (const z of [-7,-3,1,5,8.5]) {
    box(13.85,.12,.13,'#4f4131',0,4.52,z);
    for (const x of [-4.45,0,4.45]) {
      const fixture = new THREE.Mesh(new THREE.CylinderGeometry(.17,.26,.24,24),metal);
      fixture.position.set(x,4.33,z);
      scene.add(fixture);
      const diffuser = new THREE.Mesh(new THREE.CircleGeometry(.222,24),lightSurface);
      diffuser.rotation.x = Math.PI/2;
      diffuser.position.set(x,4.202,z);
      scene.add(diffuser);
    }
  }

  function contactShadow(width,depth,x,z) {
    const texture = graphic(128,128,(ctx,w,h) => {
      const shade = ctx.createRadialGradient(w/2,h/2,17,w/2,h/2,63);
      shade.addColorStop(0,'#191b16a6');
      shade.addColorStop(1,'#191b1600');
      ctx.fillStyle=shade;
      ctx.fillRect(0,0,w,h);
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width,depth),new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false}));
    mesh.position.set(x,.008,z);
    mesh.rotation.x=-Math.PI/2;
    scene.add(mesh);
  }
  const exhibits = [
    {title:'THE BARBER STUDIO', wall:'#382723', trim:'#d6a57a', floor:'#634236', light:'#ffad74', base:'#5d3027'},
    {title:'THE GAME LOUNGE', wall:'#292343', trim:'#c6e772', floor:'#493762', light:'#c3a3ff', base:'#534286'},
    {title:'THE RETRO LAB', wall:'#233b3c', trim:'#93ded0', floor:'#3c6664', light:'#96f0df', base:'#57736c'},
    {title:'THE LISTENING ROOM', wall:'#3c2230', trim:'#f2a5c1', floor:'#633348', light:'#ff82b4', base:'#622d4d'}
  ];

  function solid(geometry,color,x,y,z,parent,emissive=false) {
    const material = emissive ? new THREE.MeshBasicMaterial({color}) : new THREE.MeshLambertMaterial({color});
    const mesh = new THREE.Mesh(geometry,material);
    mesh.position.set(x,y,z);
    parent.add(mesh);
    return mesh;
  }

  function round(radius,height,color,x,y,z,parent) {
    return solid(new THREE.CylinderGeometry(radius,radius,height,26),color,x,y,z,parent);
  }

  function exhibitSign(exhibit) {
    return graphic(900,120,(ctx,w,h) => {
      ctx.fillStyle = exhibit.wall;
      ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = exhibit.trim;
      ctx.lineWidth = 3;
      ctx.strokeRect(8,8,w-16,h-16);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = exhibit.trim;
      ctx.font = '700 48px system-ui';
      ctx.fillText(exhibit.title,w/2,h/2);
    });
  }

  function barberProps(bay) {
    const chair = new THREE.Group();
    chair.position.set(-1.3,0,.63);
    chair.rotation.y = -.28;
    bay.add(chair);
    round(.35,.07,'#c4aa8b',0,.07,0,chair);
    round(.075,.45,'#c4aa8b',0,.3,0,chair);
    box(.64,.17,.58,'#7a3025',0,.58,0,chair);
    box(.59,.48,.15,'#7a3025',0,.82,-.24,chair);
    box(.23,.15,.12,'#7a3025',0,1.12,-.24,chair);
    for (const x of [-.32,.32]) {
      box(.05,.2,.05,'#b59677',x,.68,-.06,chair);
      box(.1,.06,.43,'#43271f',x,.79,.01,chair);
    }
    box(.46,.06,.22,'#b59677',0,.31,.44,chair);
    const pole = graphic(160,500,(ctx,w,h) => {
      ctx.fillStyle='#f2dfbb';ctx.fillRect(0,0,w,h);
      ctx.lineWidth=42;
      for (let y=-130;y<h+160;y+=140) {
        for (const [color,offset] of [['#9f3c32',0],['#335766',70]]) {
          ctx.strokeStyle=color;ctx.beginPath();
          ctx.moveTo(0,y+offset);ctx.lineTo(w,y+120+offset);ctx.stroke();
        }
      }
    });
    box(.42,1.37,.19,'#bd9a71',-1.48,1.98,-1.05,bay);
    sign(.33,1.21,pole,-1.48,1.98,-.95,bay);
  }

  function gameProps(bay) {
    const bench = box(.88,.24,.62,'#8254a2',1.25,.36,.7,bay);
    bench.rotation.y = -.18;
    for (const x of [.96,1.53]) box(.08,.23,.47,'#282239',x,.14,.69,bay);
    const dice = graphic(180,180,(ctx,w,h) => {
      ctx.fillStyle='#d4f185';ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#35264d';
      for (const [x,y] of [[.27,.27],[.73,.27],[.5,.5],[.27,.73],[.73,.73]]) {
        ctx.beginPath();ctx.arc(w*x,h*y,13,0,Math.PI*2);ctx.fill();
      }
    });
    const cube = new THREE.Group();
    cube.position.set(1.44,1.86,-.63);
    cube.rotation.set(.25,-.36,.29);
    bay.add(cube);
    box(.49,.49,.49,'#a9c75f',0,0,0,cube);
    sign(.48,.48,dice,0,0,.249,cube);
    for (let step=0;step<4;step++) {
      const rail = box(.5,.04,.045,'#9d72d2',-1.51,1.35+step*.25,-1.08,bay);
      rail.rotation.z = step%2 ? .26 : -.26;
    }
  }

  function labProps(bay) {
    const tower = box(.36,.93,.56,'#afa88e',-1.4,.5,.35,bay);
    tower.rotation.y = .1;
    for(let i=0;i<5;i++) box(.23,.018,.015,'#555b50',-1.4,.72+i*.032,.64,bay);
    solid(new THREE.SphereGeometry(.029,10,10),'#8fffaf',-1.46,.5,.648,bay,true);
    const terminal = graphic(360,520,(ctx,w,h) => {
      ctx.fillStyle='#202e2c';ctx.fillRect(0,0,w,h);
      ctx.strokeStyle='#54857c';ctx.lineWidth=3;
      for(let y=24;y<h;y+=26){ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(w-10,y);ctx.stroke();}
      ctx.fillStyle='#8fe3c2';ctx.font='700 22px monospace';
      ['PGLN SYSTEMS','PORTFOLIO OS','> READY'].forEach((line,i)=>ctx.fillText(line,20,70+i*49));
      ctx.fillRect(124,186,12,21);
    });
    box(.77,1.08,.16,'#979681',-1.35,1.82,-1.05,bay);
    sign(.68,.98,terminal,-1.35,1.82,-.96,bay);
  }

  function listeningProps(bay) {
    const speaker = box(.56,1.03,.52,'#382735',1.33,.57,.58,bay);
    speaker.rotation.y = -.1;
    for (const [radius,y] of [[.16,.47],[.104,.78]]) {
      const cone = solid(new THREE.CylinderGeometry(radius,radius,.047,28),'#b389a9',1.31,y,.866,bay);
      cone.rotation.x = Math.PI/2;
      const dustCap=solid(new THREE.SphereGeometry(radius*.48,16,12),'#563e55',1.31,y,.891,bay);
      dustCap.scale.z=.35;
    }
    const record = graphic(360,360,(ctx,w,h) => {
      ctx.fillStyle='#452b40';ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#1b1921';ctx.beginPath();ctx.arc(180,180,151,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#6f5268';ctx.lineWidth=2;
      for(let r=65;r<143;r+=10){ctx.beginPath();ctx.arc(180,180,r,0,Math.PI*2);ctx.stroke();}
      ctx.fillStyle='#e3a7c0';ctx.beginPath();ctx.arc(180,180,49,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#1b1921';ctx.beginPath();ctx.arc(180,180,8,0,Math.PI*2);ctx.fill();
    });
    box(.86,.86,.14,'#ac7895',1.34,2.04,-1.04,bay);
    sign(.77,.77,record,1.34,2.04,-.963,bay);
  }

  const decorate = [barberProps,gameProps,labProps,listeningProps];
  for (const [index,project] of projects.entries()) {
    const exhibit = exhibits[index];
    const side = Math.sign(project.x);
    const bay = new THREE.Group();
    bay.position.set(project.x,0,project.z);
    bay.rotation.y = -side*.23;
    scene.add(bay);
    box(3.88,.025,3.35,exhibit.floor,0,.022,.23,bay);
    box(3.91,.024,.038,exhibit.trim,0,.04,1.88,bay);
    box(3.78,3.5,.18,exhibit.wall,0,1.78,-1.19,bay);
    box(.16,3.5,2.42,exhibit.wall,side*1.86,1.78,-.09,bay);
    box(3.9,.18,2.48,exhibit.wall,0,3.53,-.1,bay);
    box(.085,3.32,.1,exhibit.trim,side*1.86,1.77,1.14,bay);
    solid(new THREE.BoxGeometry(3.61,.027,.034),exhibit.light,0,3.426,.97,bay,true);
    box(3.52,.47,.115,exhibit.wall,0,3.18,-.98,bay);
    sign(3.42,.455,exhibitSign(exhibit),0,3.18,-.917,bay);
    decorate[index](bay);
    const accentLight = new THREE.PointLight(exhibit.light,9.5,5.5,1.8);
    accentLight.position.set(project.x,2.85,project.z+.67);
    scene.add(accentLight);
    const stand = new THREE.Group();
    stand.position.set(project.x,0,project.z);
    stand.rotation.y = project.x < 0 ? .56 : -.56;
    scene.add(stand);
    contactShadow(4.3,3.2,project.x,project.z);
    box(2.1,.09,1.5,exhibit.wall,0,.075,0,stand);
    const pedestal = box(1.98,.9,1.43,exhibit.base,0,.5,0,stand);
    for (let x=-.88;x<=.89;x+=.155) {
      box(.07,.78,.026,exhibit.wall,x,.5,.73,stand);
    }
    box(2.03,.036,1.45,exhibit.trim,0,.965,0,stand);
    box(2.13,.14,1.53,exhibit.base,0,1.055,0,stand);
    box(2.07,.022,.045,exhibit.trim,0,.996,.755,stand);
    box(1.9,.06,.65,'#4a5745',0,1.14,0,stand);
    const frame = box(2.19,1.65,.19,'#252a22',0,2.02,-.069,stand);
    box(2.11,1.575,.018,exhibit.trim,0,2.02,.03,stand);
    const poster = sign(2.02,1.51,graphic(672,502,(ctx,w,h) => {
      const print = ctx.createLinearGradient(0,0,w,h);
      print.addColorStop(0,'#f9ecd4');
      print.addColorStop(.98,project.color);
      ctx.fillStyle = print;ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = project.ink;
      ctx.globalAlpha = .12;
      for(let radius=112;radius<400;radius+=24) {
        ctx.beginPath();ctx.arc(w-10,h-100,radius,0,Math.PI*2);ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = project.ink;ctx.fillRect(0,0,w,59);
      ctx.fillStyle = project.color;ctx.font = '700 27px monospace';ctx.fillText(project.type,30,40);
      ctx.fillStyle = project.ink;
      const rows = project.label.length;
      const longest = Math.max(...project.label.map(line => line.length));
      ctx.font = '900 ' + (longest > 8 ? 92 : 134) + 'px system-ui';
      project.label.forEach((line,index) => ctx.fillText(line,28,rows === 1 ? 305 : 249 + index*127));
      ctx.fillRect(30,443,w-60,2);
      ctx.font = '700 23px monospace';ctx.fillText('PGLN',30,481);
    }),0,2.02,.043,stand);
    for (const mesh of [pedestal,frame,poster]) {
      mesh.userData.project = project;
      displays.push(mesh);
    }
  }

  function resize() {
    renderer.setSize(innerWidth,innerHeight,false);
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize',resize);
  resize();
  visitDisplay = project => {
    const side = Math.sign(project.x);
    camera.position.set(project.x-side*2.45,1.72,project.z+2.6);
    yaw = Math.atan2(camera.position.x-project.x,camera.position.z-project.z);
    pitch = 0;
    showProject(project,true);
  };
  document.querySelectorAll('[data-locate]').forEach(button => button.hidden = false);

  function inspect(x,y,keyboard = false) {
    pointer.set(x,y);
    ray.setFromCamera(pointer,camera);
    const hit = ray.intersectObjects(displays,false)[0];
    if (hit) showProject(hit.object.userData.project,keyboard);
    else panel.hidden = true;
  }

  let drag;
  canvas.addEventListener('pointerdown',event => {
    if (event.button !== 0) return;
    canvas.focus({preventScroll:true});
    drag = {id:event.pointerId,x:event.clientX,y:event.clientY,distance:0};
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove',event => {
    if (drag?.id !== event.pointerId) return;
    const dx = event.clientX-drag.x;
    const dy = event.clientY-drag.y;
    drag.distance += Math.abs(dx)+Math.abs(dy);
    drag.x = event.clientX;
    drag.y = event.clientY;
    yaw -= dx*.004;
    pitch = THREE.MathUtils.clamp(pitch+dy*.004,-.83,.8);
  });
  canvas.addEventListener('pointerup',event => {
    if (drag?.id !== event.pointerId) return;
    if (drag.distance < 8) inspect(event.clientX/innerWidth*2-1,1-event.clientY/innerHeight*2);
    drag = undefined;
  });
  canvas.addEventListener('pointercancel',() => drag = undefined);
  const movement = ['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  addEventListener('keydown',event => {
    if (directory.open || event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.target instanceof HTMLButtonElement || event.target instanceof HTMLAnchorElement) return;
    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    if (movement.includes(key)) {
      event.preventDefault();
      keys.add(key);
    } else if (key === 'Enter' && event.target === canvas) {
      event.preventDefault();
      inspect(0,0,true);
    }
  });
  addEventListener('keyup',event => keys.delete(event.key.length === 1 ? event.key.toLowerCase() : event.key));
  addEventListener('blur',() => keys.clear());
  for (const button of controls.querySelectorAll('button')) {
    const key = button.dataset.key;
    button.addEventListener('pointerdown',event => {
      button.setPointerCapture(event.pointerId);
      keys.add(key);
    });
    button.addEventListener('lostpointercapture',() => keys.delete(key));
    button.addEventListener('click',event => {
      if (event.detail === 0) walk(key === 'd' ? .35 : key === 'a' ? -.35 : 0,key === 'w' ? .35 : key === 's' ? -.35 : 0);
    });
  }

  function canStand(x,z) {
    return Math.abs(x) < 6.56 && Math.abs(z) < 9.05 &&
      !projects.some(project => {
        const side = Math.sign(project.x);
        const angle = -side*.23;
        const dx = x-project.x;
        const dz = z-project.z;
        const bayX = Math.cos(angle)*dx-Math.sin(angle)*dz;
        const bayZ = Math.sin(angle)*dx+Math.cos(angle)*dz;
        return (Math.abs(bayX) < 2.05 && bayZ > -1.48 && bayZ < -.87) ||
          (Math.abs(bayX-side*1.86) < .27 && bayZ > -1.42 && bayZ < 1.37) ||
          (Math.abs(bayX) < 1.78 && bayZ > -.94 && bayZ < 1.02);
      });
  }

  function walk(side,forward) {
    const x = camera.position.x + Math.cos(yaw)*side - Math.sin(yaw)*forward;
    const z = camera.position.z - Math.sin(yaw)*side - Math.cos(yaw)*forward;
    if (canStand(x,camera.position.z)) camera.position.x = x;
    if (canStand(camera.position.x,z)) camera.position.z = z;
  }

  let lastTime = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min((now-lastTime)/1000,.05);
    lastTime = now;
    yaw += (Number(keys.has('ArrowLeft'))-Number(keys.has('ArrowRight')))*dt*1.65;
    pitch = THREE.MathUtils.clamp(pitch+(Number(keys.has('ArrowUp'))-Number(keys.has('ArrowDown')))*dt*1.4,-.83,.8);
    const side = Number(keys.has('d'))-Number(keys.has('a'));
    const forward = Number(keys.has('w'))-Number(keys.has('s'));
    const speed = 3.25*dt/(side && forward ? Math.SQRT2 : 1);
    if (side || forward) walk(side*speed,forward*speed);
    camera.rotation.set(pitch,yaw,0);
    renderer.render(scene,camera);
  });
  status.hidden = true;
  controls.hidden = false;
  hint.textContent = matchMedia('(pointer: coarse)').matches ? 'Use the arrows to walk · Drag to look · Tap a display' : 'WASD to walk · Drag or use arrow keys to look · Click a display';
  hint.hidden = false;
} catch (error) {
  status.textContent = 'The 3D store couldn’t start. Open the directory to visit the projects.';
  console.error(error);
}
</script>
</body>
</html>
