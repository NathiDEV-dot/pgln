<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Walk through the PGLN 3D store and discover websites, platforms and interactive projects.">
<title>PGLN — 3D Store</title>
<style>
:root{color-scheme:dark;--paper:#f9f3df;--muted:#c6c5ad;--lime:#f7dca3;--panel:#202720;--line:#f7dca34d;font:16px/1.4 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#1c2720;color:var(--paper)}
button,a{font:inherit;color:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,canvas:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
#world{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}#world:active{cursor:grabbing}
header{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.1rem clamp(1rem,3vw,3rem);background:linear-gradient(#101710ef,transparent);pointer-events:none}
header>*{pointer-events:auto}.brand{display:flex;align-items:center;gap:.8rem}.brand strong{font-size:1.9rem;letter-spacing:-.1em;line-height:1}.brand span{font:700 .72rem/1.2 monospace;color:var(--lime);padding-left:.8rem;border-left:1px solid var(--line);letter-spacing:.11em}
button,.open{border:1px solid var(--line);border-radius:.45rem;background:var(--panel);padding:.58rem .9rem}
button:hover{border-color:var(--lime)}
#status{position:fixed;top:37%;left:50%;transform:translateX(-50%);padding:1rem;background:var(--panel);border-radius:.5rem;text-align:center;max-width:min(88vw,26rem)}
#hint{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);margin:0;padding:.5rem .8rem;border-radius:.35rem;background:#161d18ed;border:1px solid var(--line);text-align:center;font-size:.83rem;white-space:nowrap}
#controls{position:fixed;bottom:1rem;left:1rem;display:grid;grid-template-columns:repeat(3,2.8rem);gap:.3rem}
#controls button{touch-action:none;padding:0;min-height:2.55rem;font-size:1.2rem;user-select:none}
#controls [data-key="w"]{grid-column:2}#controls [data-key="a"]{grid-column:1}
#panel{position:fixed;right:1rem;bottom:1rem;width:min(22rem,calc(100% - 2rem));padding:1.2rem;border:1px solid var(--line);border-radius:.75rem;background:var(--panel);box-shadow:0 10px 40px #0005}
#panel h2{margin:0;line-height:1.1;font-size:1.7rem;letter-spacing:-.05em}
#panel p{margin:.65rem 0 1rem;color:var(--muted)}
#close-detail{float:right;margin:-.4rem -.45rem 0 .4rem}
.open{display:inline-block;text-decoration:none;background:var(--lime);border-color:var(--lime);color:#1c2617;font-weight:800}
dialog{width:min(28rem,calc(100% - 2rem));max-height:85dvh;color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:1.25rem}
dialog::backdrop{background:#101611a8}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}.dialog-head h1{margin:0;font-size:1.45rem;letter-spacing:-.04em}
.directory{list-style:none;padding:0;margin:1rem 0 0}.directory li{display:flex;align-items:center;justify-content:space-between;gap:.4rem;border-top:1px solid var(--line);padding:.65rem 0}.directory a{text-underline-offset:.25rem}.directory button{font-size:.78rem;white-space:nowrap}
[hidden]{display:none!important}
@media(max-width:670px){#hint{bottom:6.55rem;font-size:.72rem}#panel{bottom:9rem}header{padding:.8rem 1rem}.brand strong{font-size:1.6rem}}
</style>
</head>
<body>
<canvas id="world" tabindex="0" aria-label="PGLN 3D store. Use W A S D to walk, arrow keys to look, and Enter to inspect the display in front of you."></canvas>
<header>
  <div class="brand"><strong>PGLN</strong><span>3D STORE</span></div>
  <button id="show-directory" type="button">Directory</button>
</header>
<p id="status" role="status">Opening the store…</p>
<div id="controls" aria-label="Walk controls" hidden>
  <button data-key="w" type="button" aria-label="Walk forward">↑</button>
  <button data-key="a" type="button" aria-label="Step left">←</button>
  <button data-key="s" type="button" aria-label="Walk backward">↓</button>
  <button data-key="d" type="button" aria-label="Step right">→</button>
</div>
<p id="hint" hidden></p>
<section id="panel" aria-labelledby="project-title" hidden>
  <button id="close-detail" type="button" aria-label="Close project details">×</button>
  <h2 id="project-title"></h2>
  <p id="project-description"></p>
  <a class="open" id="open-project" target="_blank" rel="noopener">Open website</a>
</section>
<dialog id="directory">
  <div class="dialog-head"><h1>Store directory</h1><form method="dialog"><button>Close</button></form></div>
  <ul class="directory" id="directory-list"></ul>
</dialog>
<script type="module">
const projects = [
  { name:'THE CUT', description:'A barber studio website with a gallery and appointment booking.', url:'https://the-cut-barber-studio-nkosi.nathinice0125.chatgpt.site', x:-4.45, z:2.1 },
  { name:'Game Night', description:'A charades game to play with friends.', url:'https://games-night-charades.nathinice0125.chatgpt.site', x:4.45, z:2.1 },
  { name:'Portfolio OS', description:'A retro desktop you can explore in your browser.', url:'https://nkosi-desktop-portfolio.nathinice0125.chatgpt.site', x:-4.45, z:-3.7 },
  { name:'$tussy — Mfana ko West', description:'A creative portfolio built around a device-inspired interface.', url:'https://frvky-desktop-recreation.nathinice0125.chatgpt.site', x:4.45, z:-3.7 },
  { name:'Saelune Active', description:'A live activewear storefront built on the reusable Iaac Commerce platform, with product variants, checkout and delivery.', url:'https://dnmpjdbyl3ja5.cloudfront.net', x:-4.45, z:-9.5 },
  { name:'Primary Onboarding', description:'A business operations platform for South African freelancers and SMEs, covering quotes, agreements, invoicing, expenses and reports.', url:'https://d3223h59o0v7yn.cloudfront.net', x:4.45, z:-9.5 },
  { name:'Serverless Blog & Custom CMS', description:'A publishing platform with editorial review, scheduling, media, newsletters and a public blog.', url:'https://d2d5b0j6iun0gv.cloudfront.net', x:-4.45, z:-15.3 },
  { name:'PGLN.Auth', description:'A reusable .NET 10 authentication and identity platform for ASP.NET Core applications.', url:'https://github.com/NuGetPackagesPGLN/PGLN.JwtAuth', action:'View source on GitHub', x:4.45, z:-15.3 }
];
const canvas = document.querySelector('#world');
const directory = document.querySelector('#directory');
const panel = document.querySelector('#panel');
const openProject = document.querySelector('#open-project');
const status = document.querySelector('#status');
const controls = document.querySelector('#controls');
const hint = document.querySelector('#hint');
const keys = new Set();
let visitDisplay;

for (const project of projects) {
  const item = document.createElement('li');
  const link = document.createElement('a');
  link.textContent = project.name;
  link.href = project.url;
  link.target = '_blank';
  link.rel = 'noopener';
  const locate = document.createElement('button');
  locate.textContent = 'Go to display';
  locate.hidden = true;
  locate.dataset.locate = '';
  locate.addEventListener('click', () => {
    directory.close();
    visitDisplay(project);
  });
  item.append(link, locate);
  document.querySelector('#directory-list').append(item);
}
document.querySelector('#show-directory').addEventListener('click', () => {
  keys.clear();
  directory.showModal();
});
document.querySelector('#close-detail').addEventListener('click', () => {
  panel.hidden = true;
  canvas.focus();
});

function showProject(project, focus = false) {
  document.querySelector('#project-title').textContent = project.name;
  document.querySelector('#project-description').textContent = project.description;
  openProject.href = project.url;
  openProject.textContent = project.action ?? 'Open website';
  panel.hidden = false;
  if (focus) openProject.focus();
}

try {
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.07;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.needsUpdate = true;
  const scene = new THREE.Scene();
  const roomDepth = 31;
  const roomCenter = -6;
  const backWall = roomCenter-roomDepth/2;
  scene.background = new THREE.Color('#374839');
  scene.fog = new THREE.Fog('#374839', 22, 42);
  const camera = new THREE.PerspectiveCamera(68, 1, .05, 48);
  camera.rotation.order = 'YXZ';
  camera.position.set(0, 1.76, 8.5);
  let yaw = 0;
  let pitch = -.025;
  const displays = [];
  const ray = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  const finishes = new Map();
  const modeledObjects = new WeakSet();

  function finish(color, roughness = .72, metalness = 0) {
    const key = [color,roughness,metalness].join('/');
    if (!finishes.has(key)) finishes.set(key,new THREE.MeshStandardMaterial({color,roughness,metalness}));
    return finishes.get(key);
  }

  function modelMesh(geometry,material,x,y,z,parent) {
    const mesh = new THREE.Mesh(geometry,material);
    mesh.position.set(x,y,z);
    const isProp = modeledObjects.has(parent);
    mesh.castShadow = isProp;
    mesh.receiveShadow = isProp;
    parent.add(mesh);
    return mesh;
  }

  function box(width,height,depth,color,x,y,z,parent = scene,bevel = 0) {
    let geometry;
    if (bevel) {
      const profile = new THREE.Shape();
      const left = -width/2+bevel, right = width/2-bevel;
      const bottom = -height/2+bevel, top = height/2-bevel;
      profile.moveTo(left,bottom);
      profile.lineTo(right,bottom);
      profile.lineTo(right,top);
      profile.lineTo(left,top);
      profile.closePath();
      geometry = new THREE.ExtrudeGeometry(profile,{
        depth:depth-2*bevel, bevelEnabled:true, bevelSize:bevel, bevelThickness:bevel, bevelSegments:3
      });
      geometry.translate(0,0,-depth/2+bevel);
      geometry.computeVertexNormals();
    } else geometry = new THREE.BoxGeometry(width,height,depth);
    return modelMesh(geometry,finish(color),x,y,z,parent);
  }
  function graphic(width, height, draw) {
    const source = document.createElement('canvas');
    source.width = width;
    source.height = height;
    draw(source.getContext('2d'), width, height);
    const texture = new THREE.CanvasTexture(source);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return texture;
  }

  function sign(width, height, texture, x, y, z, parent = scene) {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width,height), new THREE.MeshBasicMaterial({map:texture}));
    mesh.position.set(x,y,z);
    parent.add(mesh);
    return mesh;
  }

  const brass = '#b18b4e';
  const walnut = '#624230';
  const darkGreen = '#222e26';
  const plaster = '#686856';
  const glow = '#fff0cd';
  scene.add(new THREE.HemisphereLight('#fff1da','#746758',1.55));
  const keyLight = new THREE.DirectionalLight('#fff1df',1.35);
  keyLight.position.set(-3,7,5);
  scene.add(keyLight);

  const stone = graphic(512,512,(ctx,w,h) => {
    ctx.fillStyle = '#9a8b74';
    ctx.fillRect(0,0,w,h);
    let seed = 722;
    const random = () => {
      seed = (Math.imul(seed,1664525)+1013904223) >>> 0;
      return seed/4294967296;
    };
    const tones = ['#736450','#baa88c','#e2cab0','#88795d','#544d44'];
    for (let i=0;i<2800;i++) {
      ctx.fillStyle = tones[Math.floor(random()*tones.length)];
      ctx.globalAlpha = .2+random()*.37;
      const x=random()*w, y=random()*h, size=.45+random()*2.7;
      ctx.fillRect(x,y,size*1.6,size);
    }
    ctx.globalAlpha = .32;
    ctx.strokeStyle = '#504438';
    ctx.strokeRect(.5,.5,w-1,h-1);
  });
  stone.wrapS = stone.wrapT = THREE.RepeatWrapping;
  stone.repeat.set(11,25);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(14,roomDepth),new THREE.MeshStandardMaterial({map:stone,roughness:.69,bumpMap:stone,bumpScale:.012}));
  floor.rotation.x = -Math.PI/2;
  floor.position.z = roomCenter;
  scene.add(floor);
  floor.receiveShadow = true;

  box(2.8,.009,roomDepth-1,'#394639',0,.012,roomCenter);
  for (const x of [-1.35,1.35]) box(.026,.012,roomDepth-1,brass,x,.022,roomCenter);
  box(14,4.7,.2,darkGreen,0,2.35,backWall);
  box(14,4.7,.2,plaster,0,2.35,9.5);
  box(.2,4.7,roomDepth,plaster,-7,2.35,roomCenter);
  box(.2,4.7,roomDepth,plaster,7,2.35,roomCenter);
  box(14,.2,roomDepth,'#302e26',0,4.75,roomCenter);
  for (const x of [-6.88,6.88]) {
    box(.13,.85,roomDepth,walnut,x,.425,roomCenter);
    box(.15,.045,roomDepth,brass,x,.865,roomCenter);
    for (let z = backWall+1.5; z <= 8; z += 2) {
      box(.19,3.9,.07,'#514739',x,2.79,z);
    }
  }
  const woodGrain = graphic(160,512,(ctx,w,h) => {
    ctx.fillStyle='#67462f';ctx.fillRect(0,0,w,h);
    for(let i=0;i<94;i++){
      const x=(i*41)%w;
      const drift=(i%7-3)*6;
      ctx.strokeStyle=i%4===0 ? '#c5926266' : '#3021195e';
      ctx.lineWidth=.5+(i%4)*.42;
      ctx.beginPath();ctx.moveTo(x,0);
      ctx.bezierCurveTo(x+drift,h*.29,x-drift,h*.67,x+drift*.6,h);
      ctx.stroke();
    }
  });
  const stainedWalnut = new THREE.MeshStandardMaterial({map:woodGrain,roughness:.51,bumpMap:woodGrain,bumpScale:.0027});
  for (let x = -6.6; x <= 6.7; x += .26) {
    box(.115,4.6,.18,walnut,x,2.3,backWall+.19).material = stainedWalnut;
  }
  box(14,.07,.17,brass,0,.25,backWall+.35);
  box(5.65,2.15,.25,'#292b23',0,3.03,backWall+.43);
  const masthead = graphic(1152,420,(ctx,w,h) => {
    const gradient = ctx.createLinearGradient(0,0,w,h);
    gradient.addColorStop(0,'#344236');
    gradient.addColorStop(1,'#17261f');
    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = '#bd9e61';
    ctx.lineWidth = 3;
    ctx.strokeRect(22,22,w-44,h-44);
    ctx.fillStyle = '#f9dfaa';
    ctx.textAlign = 'center';
    ctx.font = '900 172px system-ui';
    ctx.fillText('PGLN',w/2,218);
    ctx.font = '600 34px monospace';
    ctx.fillText('W E B   S H O W R O O M',w/2,300);
  });
  sign(5.47,1.99,masthead,0,3.03,backWall+.565);

  const lightSurface = new THREE.MeshBasicMaterial({color:glow});
  const metal = new THREE.MeshLambertMaterial({color:brass});
  for (const z of [-19,-15,-11,-7,-3,1,5,8.5]) {
    box(13.85,.12,.13,'#4f4131',0,4.52,z);
    for (const x of [-4.45,0,4.45]) {
      const fixture = new THREE.Mesh(new THREE.CylinderGeometry(.17,.26,.24,24),metal);
      fixture.position.set(x,4.33,z);
      scene.add(fixture);
      const diffuser = new THREE.Mesh(new THREE.CircleGeometry(.222,24),lightSurface);
      diffuser.rotation.x = Math.PI/2;
      diffuser.position.set(x,4.202,z);
      scene.add(diffuser);
    }
  }

  const exhibits = [
    {wall:'#382723', trim:'#d6a57a', floor:'#634236', light:'#ffad74'},
    {wall:'#292343', trim:'#c6e772', floor:'#493762', light:'#c3a3ff'},
    {wall:'#233b3c', trim:'#93ded0', floor:'#3c6664', light:'#96f0df'},
    {wall:'#3c2230', trim:'#f2a5c1', floor:'#633348', light:'#ff82b4'},
    {wall:'#394044', trim:'#efbc94', floor:'#67625b', light:'#f9c2a2'},
    {wall:'#283653', trim:'#b9d5fb', floor:'#425a70', light:'#9cc2ff'},
    {wall:'#4b3c2d', trim:'#e9c785', floor:'#705339', light:'#ffd19a'},
    {wall:'#282f3a', trim:'#9ce4d2', floor:'#404b59', light:'#7febd4'}
  ];

  function solid(geometry,color,x,y,z,parent,emissive=false) {
    const material = emissive ? new THREE.MeshBasicMaterial({color}) : finish(color);
    return modelMesh(geometry,material,x,y,z,parent);
  }
  function round(radius,height,color,x,y,z,parent) {
    return solid(new THREE.CylinderGeometry(radius,radius,height,26),color,x,y,z,parent);
  }

  function barberProps(bay) {
    const chair = new THREE.Group();
    chair.position.set(-.1,0,.47);
    chair.scale.setScalar(1.52);
    chair.rotation.y = -.28;
    bay.add(chair);
    modeledObjects.add(chair);
    round(.35,.07,'#c1b2a0',0,.07,0,chair).material = finish('#c1b2a0',.28,.37);
    round(.075,.45,'#c4aa8b',0,.3,0,chair);
    box(.64,.17,.58,'#8c493c',0,.58,0,chair,.037).material = finish('#8c493c',.42);
    box(.59,.48,.18,'#8c493c',0,.82,-.24,chair,.044).material = finish('#8c493c',.42);
    box(.23,.15,.12,'#8c493c',0,1.12,-.24,chair,.025).material = finish('#8c493c',.42);
    for (const x of [-.32,.32]) {
      box(.05,.2,.05,'#b59677',x,.68,-.06,chair);
      box(.1,.06,.43,'#43271f',x,.79,.01,chair);
    }
    box(.46,.06,.22,'#b59677',0,.31,.44,chair);
    const pole = graphic(160,500,(ctx,w,h) => {
      ctx.fillStyle='#f2dfbb';ctx.fillRect(0,0,w,h);
      ctx.lineWidth=42;
      for (let y=-130;y<h+160;y+=140) {
        for (const [color,offset] of [['#9f3c32',0],['#335766',70]]) {
          ctx.strokeStyle=color;ctx.beginPath();
          ctx.moveTo(0,y+offset);ctx.lineTo(w,y+120+offset);ctx.stroke();
        }
      }
    });
    const cylinder = solid(new THREE.CylinderGeometry(.16,.16,1.21,30),'#ffffff',-1.48,1.98,-.95,bay);
    cylinder.material = new THREE.MeshStandardMaterial({map:pole,roughness:.42});
    for(const y of [1.33,2.63]) round(.183,.072,'#b89570',-1.48,y,-.95,bay).material = finish('#b89570',.29,.35);
  }

  function gameProps(bay) {
    const bench = box(.88,.24,.62,'#8254a2',1.25,.36,.7,bay);
    bench.rotation.y = -.18;
    for (const x of [.96,1.53]) box(.08,.23,.47,'#282239',x,.14,.69,bay);
    const dice = graphic(180,180,(ctx,w,h) => {
      ctx.fillStyle='#d4f185';ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#35264d';
      for (const [x,y] of [[.27,.27],[.73,.27],[.5,.5],[.27,.73],[.73,.73]]) {
        ctx.beginPath();ctx.arc(w*x,h*y,13,0,Math.PI*2);ctx.fill();
      }
    });
    const cube = new THREE.Group();
    cube.position.set(0,1.53,.53);
    cube.scale.setScalar(1.8);
    cube.rotation.set(.25,-.36,.29);
    bay.add(cube);
    modeledObjects.add(cube);
    box(.49,.49,.49,'#a9c75f',0,0,0,cube);
    sign(.48,.48,dice,0,0,.249,cube);
      const dots=graphic(180,180,(ctx,w,h)=>{
        ctx.fillStyle='#bddb73';ctx.fillRect(0,0,w,h);
        ctx.fillStyle='#38284b';
        for(const [x,y] of [[.3,.3],[.7,.7]]){
          ctx.beginPath();ctx.arc(x*w,y*h,14,0,Math.PI*2);ctx.fill();
        }
      });
      const face=sign(.48,.48,dots,.249,0,0,cube);
      face.rotation.y=Math.PI/2;
    for (let step=0;step<4;step++) {
      const rail = box(.5,.04,.045,'#9d72d2',-1.51,1.35+step*.25,-1.08,bay);
      rail.rotation.z = step%2 ? .26 : -.26;
    }
  }

  function labProps(bay) {
    const tower = box(.36,.93,.56,'#afa88e',-1.4,.5,.35,bay);
    tower.rotation.y = .1;
    for(let i=0;i<5;i++) box(.23,.018,.015,'#555b50',-1.4,.72+i*.032,.64,bay);
    solid(new THREE.SphereGeometry(.029,10,10),'#8fffaf',-1.46,.5,.648,bay,true);
    const terminal = graphic(360,520,(ctx,w,h) => {
      ctx.fillStyle='#202e2c';ctx.fillRect(0,0,w,h);
      ctx.strokeStyle='#54857c';ctx.lineWidth=3;
      for(let y=24;y<h;y+=26){ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(w-10,y);ctx.stroke();}
      ctx.fillStyle='#8fe3c2';ctx.font='700 22px monospace';
      ['PGLN SYSTEMS','PORTFOLIO OS','> READY'].forEach((line,i)=>ctx.fillText(line,20,70+i*49));
      ctx.fillRect(124,186,12,21);
    });
    box(.77,1.08,.16,'#979681',-1.35,1.82,-1.05,bay);
    sign(.68,.98,terminal,-1.35,1.82,-.96,bay);
  }

  function listeningProps(bay) {
    const speaker = box(.56,1.03,.52,'#382735',1.33,.57,.58,bay);
    speaker.rotation.y = -.1;
    for (const [radius,y] of [[.16,.47],[.104,.78]]) {
      const cone = solid(new THREE.CylinderGeometry(radius,radius,.047,28),'#b389a9',1.31,y,.866,bay);
      cone.rotation.x = Math.PI/2;
      const dustCap=solid(new THREE.SphereGeometry(radius*.48,16,12),'#563e55',1.31,y,.891,bay);
      dustCap.scale.z=.35;
    }
    const record = graphic(360,360,(ctx,w,h) => {
      ctx.fillStyle='#452b40';ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#1b1921';ctx.beginPath();ctx.arc(180,180,151,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#6f5268';ctx.lineWidth=2;
      for(let r=65;r<143;r+=10){ctx.beginPath();ctx.arc(180,180,r,0,Math.PI*2);ctx.stroke();}
      ctx.fillStyle='#e3a7c0';ctx.beginPath();ctx.arc(180,180,49,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#1b1921';ctx.beginPath();ctx.arc(180,180,8,0,Math.PI*2);ctx.fill();
    });
    box(.86,.86,.14,'#ac7895',1.34,2.04,-1.04,bay);

    round(.55,.12,'#9e7654',.47,.69,.36,bay);

  function authProps(bay) {
    for(const x of [-.69,.14]){
      box(.73,1.86,.64,'#273038',x,1.015,-.56,bay,.036);
      for(let i=0;i<8;i++){

    round(.36,.095,'#52646d',.75,.57,.43,bay);

    const lock=new THREE.Group();
    lock.position.set(.75,1.07,.43);

    const shackle=solid(new THREE.TorusGeometry(.23,.047,12,36,Math.PI),'#b3c3cd',0,.21,0,lock);
    shackle.material=finish('#b3c3cd',.26,.48);
    box(.57,.49,.25,'#729994',0,.015,0,lock,.048);
    solid(new THREE.CircleGeometry(.051,22),'#263a40',0,.06,.127,lock);
    box(.034,.12,.012,'#263a40',0,-.015,.132,lock);
  }
  const decorate = [barberProps,gameProps,labProps,listeningProps,activewearProps,onboardingProps,editorialProps,authProps];
  for (const [index,project] of projects.entries()) {
    const exhibit = exhibits[index];
    const side = Math.sign(project.x);
    const bay = new THREE.Group();
    bay.position.set(project.x,0,project.z);
    bay.rotation.y = -side*.23;
    scene.add(bay);
    box(3.88,.025,3.35,exhibit.floor,0,.022,.23,bay).receiveShadow = true;
    box(3.91,.024,.038,exhibit.trim,0,.04,1.88,bay);
    box(3.78,3.5,.18,exhibit.wall,0,1.78,-1.19,bay).receiveShadow = true;
    box(.16,3.5,2.42,exhibit.wall,side*1.86,1.78,-.09,bay);
    box(3.9,.18,2.48,exhibit.wall,0,3.53,-.1,bay);
    box(.085,3.32,.1,exhibit.trim,side*1.86,1.77,1.14,bay);
    solid(new THREE.BoxGeometry(3.61,.027,.034),exhibit.light,0,3.426,.97,bay,true);
    const objects = new THREE.Group();
    bay.add(objects);
    modeledObjects.add(objects);
    decorate[index](objects);

    if (index === 0) {
      const mirror = solid(new THREE.CapsuleGeometry(.58,.71,6,30),'#c2966e',0,1.92,-1.066,objects);
      mirror.scale.z=.068;
      const glass = solid(new THREE.CapsuleGeometry(.53,.69,6,30),'#b4bdb6',0,1.92,-1.015,objects,true);
      glass.scale.z=.048;
      const reflection = graphic(256,384,(ctx,w,h)=>{
        const silver=ctx.createLinearGradient(0,0,w,h);
        silver.addColorStop(0,'#455151');silver.addColorStop(.47,'#78807b');
        silver.addColorStop(.68,'#b2aaa0');silver.addColorStop(1,'#68675d');
        ctx.fillStyle=silver;ctx.fillRect(0,0,w,h);
        ctx.save();ctx.translate(w*.38,h*.5);ctx.rotate(-.42);
        const streak=ctx.createLinearGradient(-100,0,110,0);
        streak.addColorStop(0,'#f7dbc000');streak.addColorStop(.32,'#f7dbc031');
        streak.addColorStop(.58,'#ffedce62');streak.addColorStop(1,'#f7dbc000');
        ctx.fillStyle=streak;ctx.fillRect(-100,-h,210,h*2);
        ctx.restore();
      });
      glass.material = new THREE.MeshBasicMaterial({map:reflection});
      box(.84,.028,.024,'#deb18c',0,.86,-.643,objects);
      box(1.76,.14,.42,'#bd9469',0,.87,-.87,objects);
      box(1.63,.41,.34,'#703d30',0,.63,-.89,objects);
      for(const x of [-.54,0,.54]) box(.16,.032,.031,'#d5ae82',x,.69,-.709,objects);
      for(const x of [-.72,.72]) solid(new THREE.BoxGeometry(.05,.65,.04),'#ffd8ae',x,1.95,-1.062,objects,true);
      round(.065,.19,'#365050',.68,1.035,-.86,objects);
    } else if (index === 1) {
      box(2.34,.25,.74,'#77549a',0,.48,-.66,objects,.055);
      box(2.34,.59,.23,'#654389',0,.8,-.98,objects,.047);
      for(const x of [-1.06,1.06]) {
        box(.21,.32,.71,'#634384',x,.62,-.63,objects);
        box(.12,.26,.53,'#30243d',x,.24,-.63,objects);
      }
      for(const x of [-.64,0,.64]) box(.6,.12,.52,'#9a76b7',x,.645,-.61,objects,.034);
      round(.6,.1,'#55416c',0,.56,.64,objects);
      round(.13,.43,'#432f55',0,.315,.64,objects);
      round(.42,.065,'#55416c',0,.08,.64,objects);
      for(const [x,color] of [[-.33,'#ffc179'],[.25,'#c595dd']]) {
        const cards=box(.21,.023,.31,color,x,.626,.7,objects);
        cards.rotation.y=x;
      }
    } else if (index === 2) {
      box(2.54,.12,.9,'#a79d84',0,.93,.02,objects);
      for(const x of [-1.08,1.08]) box(.13,.87,.68,'#4a5e56',x,.445,.02,objects);
      box(1.39,1,.72,'#b5ae96',-.05,1.52,-.1,objects,.052);
      box(1.23,.8,.05,'#3e4f46',-.05,1.55,.27,objects,.015);
      const screen=graphic(640,400,(ctx,w,h)=>{
        ctx.fillStyle='#172b25';ctx.fillRect(0,0,w,h);
        ctx.strokeStyle='#44645a';
        for(let y=8;y<h;y+=10){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
        ctx.fillStyle='#a5f4c8';ctx.font='700 39px monospace';
        ['PGLN SYSTEMS','> BOOT COMPLETE','> READY'].forEach((line,i)=>ctx.fillText(line,36,94+i*80));
        ctx.fillRect(218,224,22,28);
      });
      sign(1.11,.68,screen,-.05,1.57,.302,objects);
      solid(new THREE.SphereGeometry(.026,12,8),'#abffc9',.43,1.176,.304,objects,true);
      box(1.03,.067,.33,'#aba88e',-.05,1.027,.36,objects);
      for(let row=0;row<3;row++){
        for(let col=0;col<11;col++) box(.063,.016,.059,'#707c6b',-.47+col*.083,1.065,.275+row*.078,objects);
      }
      box(.35,.66,.53,'#a7a58d',.94,1.32,-.03,objects,.022);
      for(let i=0;i<4;i++) box(.22,.019,.02,'#59675d',.94,1.39+i*.031,.243,objects);
    } else if (index === 3) {
      box(1.72,.62,.76,'#704563',0,.56,.14,objects,.035);
      box(1.81,.09,.79,'#b883a1',0,.915,.14,objects);
      box(1.32,.29,.032,'#442c40',0,.56,.527,objects);
      for(const x of [-.72,.72]) box(.07,.23,.5,'#452c3f',x,.16,.14,objects);
      box(1.16,.09,.56,'#372938',0,1.01,.14,objects);
      round(.257,.042,'#1c1821',-.14,1.083,.14,objects);
      round(.075,.008,'#e8accc',-.14,1.108,.14,objects);
      const arm=box(.035,.035,.29,'#d8b4b2',.27,1.105,.13,objects);
      arm.rotation.y=.34;
      box(.52,1.06,.52,'#382735',-1.24,.575,.58,objects,.024);
      for(const [radius,y] of [[.157,.47],[.101,.8]]){
        const cone=solid(new THREE.CylinderGeometry(radius,radius,.04,25),'#bd8fa9',-1.24,y,.86,objects);
        cone.rotation.x=Math.PI/2;
        const cap=solid(new THREE.SphereGeometry(radius*.45,14,10),'#533a50',-1.24,y,.883,objects);
        cap.scale.z=.4;
      }
      for(const [x,y] of [[-.86,2.03],[-.03,2.31]]){
        const sleeve=solid(new THREE.TorusGeometry(.265,.025,10,32),'#d490aa',x,y,-1.055,objects);
        sleeve.rotation.z=.17;
        solid(new THREE.CircleGeometry(.248,36),'#231e27',x,y,-1.052,objects);
        solid(new THREE.CircleGeometry(.079,22),'#b9789c',x,y,-1.048,objects);
      }
    }

    const mount = new THREE.Group();
    mount.position.set(-side*.99,.66,1.43);
    mount.rotation.y=-side*.2;
    objects.add(mount);
    modeledObjects.add(mount);
    round(.15,.042,exhibit.wall,0,-.62,0,mount);
    round(.028,.62,exhibit.trim,0,-.31,0,mount);
    box(.87,.24,.047,exhibit.wall,0,.025,0,mount);
    const plaque=graphic(620,165,(ctx,w,h)=>{
      ctx.fillStyle=exhibit.wall;ctx.fillRect(0,0,w,h);
      ctx.strokeStyle=exhibit.trim;ctx.lineWidth=3;ctx.strokeRect(6,6,w-12,h-12);
      ctx.fillStyle=exhibit.trim;ctx.font='700 41px system-ui';
      ctx.fillText(project.name,23,69,w-46);
      ctx.font='600 24px monospace';ctx.fillText('VIEW PROJECT',23,122);
    });
    sign(.838,.218,plaque,0,.025,.026,mount);

    objects.traverse(mesh => {
      if (!mesh.isMesh) return;
      mesh.userData.project = project;
      displays.push(mesh);
    });
    const fixture = round(.12,.16,'#3b3229',0,3.35,.78,bay);
    fixture.material = finish('#74634e',.45,.35);
    solid(new THREE.CylinderGeometry(.092,.092,.015,22),'#fff2d7',0,3.263,.78,bay,true);
    const accentLight = new THREE.PointLight(exhibit.light,4.6,5,2);
    accentLight.position.set(project.x,2.56,project.z-.12);
    scene.add(accentLight);
    const spotlight = new THREE.SpotLight('#fff1da',23,7,.68,.7,2);
    spotlight.position.set(project.x,3.23,project.z+.94);
    spotlight.target.position.set(project.x,.44,project.z+.14);
    spotlight.castShadow = true;
    spotlight.shadow.mapSize.set(512,512);
    spotlight.shadow.camera.near=.2;
    spotlight.shadow.camera.far=7;
    spotlight.shadow.bias=-.00018;
    spotlight.shadow.normalBias=.025;
    scene.add(spotlight,spotlight.target);
  }
  function resize() {
    renderer.setSize(innerWidth,innerHeight,false);
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize',resize);
  resize();
  visitDisplay = project => {
    const side = Math.sign(project.x);
    camera.position.set(project.x-side*2.45,1.72,project.z+2.6);
    yaw = Math.atan2(camera.position.x-project.x,camera.position.z-project.z);
    pitch = 0;
    showProject(project,true);
  };
  document.querySelectorAll('[data-locate]').forEach(button => button.hidden = false);

  function inspect(x,y,keyboard = false) {
    pointer.set(x,y);
    ray.setFromCamera(pointer,camera);
    const hit = ray.intersectObjects(displays,false)[0];
    if (hit) showProject(hit.object.userData.project,keyboard);
    else panel.hidden = true;
  }

  let drag;
  canvas.addEventListener('pointerdown',event => {
    if (event.button !== 0) return;
    canvas.focus({preventScroll:true});
    drag = {id:event.pointerId,x:event.clientX,y:event.clientY,distance:0};
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove',event => {
    if (drag?.id !== event.pointerId) return;
    const dx = event.clientX-drag.x;
    const dy = event.clientY-drag.y;
    drag.distance += Math.abs(dx)+Math.abs(dy);
    drag.x = event.clientX;
    drag.y = event.clientY;
    yaw -= dx*.004;
    pitch = THREE.MathUtils.clamp(pitch+dy*.004,-.83,.8);
  });
  canvas.addEventListener('pointerup',event => {
    if (drag?.id !== event.pointerId) return;
    if (drag.distance < 8) inspect(event.clientX/innerWidth*2-1,1-event.clientY/innerHeight*2);
    drag = undefined;
  });
  canvas.addEventListener('pointercancel',() => drag = undefined);
  const movement = ['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  addEventListener('keydown',event => {
    if (directory.open || event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.target instanceof HTMLButtonElement || event.target instanceof HTMLAnchorElement) return;
    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    if (movement.includes(key)) {
      event.preventDefault();
      keys.add(key);
    } else if (key === 'Enter' && event.target === canvas) {
      event.preventDefault();
      inspect(0,0,true);
    }
  });
  addEventListener('keyup',event => keys.delete(event.key.length === 1 ? event.key.toLowerCase() : event.key));
  addEventListener('blur',() => keys.clear());
  for (const button of controls.querySelectorAll('button')) {
    const key = button.dataset.key;
    button.addEventListener('pointerdown',event => {
      button.setPointerCapture(event.pointerId);
      keys.add(key);
    });
    button.addEventListener('lostpointercapture',() => keys.delete(key));
    button.addEventListener('click',event => {
      if (event.detail === 0) walk(key === 'd' ? .35 : key === 'a' ? -.35 : 0,key === 'w' ? .35 : key === 's' ? -.35 : 0);
    });
  }

  function canStand(x,z) {
    return Math.abs(x) < 6.56 && z > backWall+.45 && z < 9.05 &&
      !projects.some(project => {
        const side = Math.sign(project.x);
        const angle = -side*.23;
        const dx = x-project.x;
        const dz = z-project.z;
        const bayX = Math.cos(angle)*dx-Math.sin(angle)*dz;
        const bayZ = Math.sin(angle)*dx+Math.cos(angle)*dz;
        return (Math.abs(bayX) < 2.05 && bayZ > -1.48 && bayZ < -.87) ||
          (Math.abs(bayX-side*1.86) < .27 && bayZ > -1.42 && bayZ < 1.37) ||
          (Math.abs(bayX) < 1.78 && bayZ > -.94 && bayZ < 1.02);
      });
  }

  function walk(side,forward) {
    const x = camera.position.x + Math.cos(yaw)*side - Math.sin(yaw)*forward;
    const z = camera.position.z - Math.sin(yaw)*side - Math.cos(yaw)*forward;
    if (canStand(x,camera.position.z)) camera.position.x = x;
    if (canStand(camera.position.x,z)) camera.position.z = z;
  }

  let lastTime = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min((now-lastTime)/1000,.05);
    lastTime = now;
    yaw += (Number(keys.has('ArrowLeft'))-Number(keys.has('ArrowRight')))*dt*1.65;
    pitch = THREE.MathUtils.clamp(pitch+(Number(keys.has('ArrowUp'))-Number(keys.has('ArrowDown')))*dt*1.4,-.83,.8);
    const side = Number(keys.has('d'))-Number(keys.has('a'));
    const forward = Number(keys.has('w'))-Number(keys.has('s'));
    const speed = 3.25*dt/(side && forward ? Math.SQRT2 : 1);
    if (side || forward) walk(side*speed,forward*speed);
    camera.rotation.set(pitch,yaw,0);
    renderer.render(scene,camera);
  });
  status.hidden = true;
  controls.hidden = false;
  hint.textContent = matchMedia('(pointer: coarse)').matches ? 'Use the arrows to walk · Drag to look · Tap a display' : 'WASD to walk · Drag or use arrow keys to look · Click a display';
  hint.hidden = false;
} catch (error) {
  status.textContent = 'The 3D store couldn’t start. Open the directory to visit the projects.';
  console.error(error);
}
</script>
